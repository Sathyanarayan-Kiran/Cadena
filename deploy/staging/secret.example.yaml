# Example only. Do not commit a populated Secret. Create `cadena-staging-secrets`
# through the cluster's external-secret provider or the command in README.md.
apiVersion: v1
kind: Secret
metadata:
  name: cadena-staging-secrets
  namespace: cadena-staging
type: Opaque
stringData:
  DATABASE_URL: postgresql://cadena:REPLACE_ME@postgres.example.internal:5432/cadena
  CADENA_DATABASE_CA_BASE64: BASE64_ENCODED_DATABASE_CA_CERTIFICATE
  CADENA_BOOTSTRAP_TOKEN: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
