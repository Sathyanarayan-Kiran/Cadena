apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadena-api
  namespace: cadena-staging
  labels:
    app.kubernetes.io/name: cadena-api
    app.kubernetes.io/part-of: cadena
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cadena-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadena-api
        app.kubernetes.io/part-of: cadena
        environment: staging
    spec:
      serviceAccountName: cadena-api
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/replace-owner/cadena:replace-tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: cadena-staging-config
            - secretRef:
                name: cadena-staging-secrets
          env:
            - name: CADENA_BUILD_SHA
              value: replace-build-sha
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
