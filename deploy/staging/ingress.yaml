apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cadena-api
  namespace: cadena-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.cadena.example
      secretName: cadena-staging-tls
  rules:
    - host: staging.cadena.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cadena-api
                port:
                  name: http
