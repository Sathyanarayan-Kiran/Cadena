name: Publish and deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cadena-staging
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Resolve immutable image name
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Install staging kubeconfig
        shell: bash
        env:
          KUBE_CONFIG_STAGING_B64: ${{ secrets.KUBE_CONFIG_STAGING_B64 }}
        run: |
          test -n "$KUBE_CONFIG_STAGING_B64"
          echo "$KUBE_CONFIG_STAGING_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
      - name: Apply staging resources
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl apply -f deploy/staging/namespace.yaml
          kubectl -n cadena-staging get secret cadena-staging-secrets
          kubectl apply -k deploy/staging
      - name: Deploy immutable image
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          kubectl -n cadena-staging set image deployment/cadena-api api="$IMAGE"
          kubectl -n cadena-staging set env deployment/cadena-api CADENA_BUILD_SHA="${GITHUB_SHA}"
          kubectl -n cadena-staging rollout status deployment/cadena-api --timeout=5m
