name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npm run tracker
      - name: Ensure generated tracker is current
        run: git diff --exit-code -- public/status.html
      - run: npm run test:ui
      - uses: azure/setup-kubectl@v4
      - name: Render staging manifests
        run: kubectl kustomize deploy/staging
      - name: Build immutable runtime image
        run: docker build --tag cadena:${{ github.sha }} .
